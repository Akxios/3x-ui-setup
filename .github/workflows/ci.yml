name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  install-smoke:
    name: Checks and nginx smoke (${{ matrix.os }})
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, debian-12]
        include:
          - os: ubuntu-24.04
            image: ubuntu:24.04
          - os: debian-12
            image: debian:12
    container:
      image: ${{ matrix.image }}
    steps:
      - name: Install test tools
        env:
          DEBIAN_FRONTEND: noninteractive
        run: |
          apt-get update
          apt-get install -y --no-install-recommends \
            bash ca-certificates curl git iproute2 nginx nodejs openssl \
            python3 shellcheck util-linux

      - name: Checkout
        uses: actions/checkout@v4.4.0
        with:
          persist-credentials: false

      - name: Check Bash syntax and ShellCheck
        run: |
          bash -n bootstrap.sh scripts/install.sh scripts/lib/*.sh scripts/modules/*.sh tests/*.sh
          shellcheck -S warning bootstrap.sh scripts/install.sh scripts/lib/*.sh scripts/modules/*.sh tests/*.sh

      - name: Run Python tests
        run: python3 -m unittest discover -s tests -q

      - name: Smoke-test nginx installation and site templates
        env:
          CI_SMOKE: "1"
        run: bash tests/ci_nginx_smoke.sh
